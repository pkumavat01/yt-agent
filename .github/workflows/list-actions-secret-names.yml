name: List Actions Secret Names

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  list-secret-names:
    runs-on: ubuntu-latest
    steps:
      - name: Print Actions secret names
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ACTIONS_SECRET_READER_TOKEN || github.token }}
        run: |
          set -euo pipefail

          {
            echo "### Actions token and secret names"
            echo ""
            echo "Workflow token name:"
            echo "- GITHUB_TOKEN"
            echo ""
            echo "Repository Actions secrets visible to this workflow:"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Workflow token name:"
          echo "GITHUB_TOKEN"
          echo ""
          echo "Repository Actions secrets visible to this workflow:"

          response_file="$(mktemp)"
          error_file="$(mktemp)"
          status="$(curl -sS -L -o "$response_file" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/secrets" 2>"$error_file" || true)"

          if [ "$status" = "200" ]; then
            names="$(jq -r '.secrets[]?.name' "$response_file")"

            if [ -z "$names" ]; then
              echo "No repository Actions secrets found."
              echo "- No repository Actions secrets found." >> "$GITHUB_STEP_SUMMARY"
            else
              printf "%s\n" "$names"
              printf "%s\n" "$names" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            message="$(jq -r '.message // empty' "$response_file" 2>/dev/null || true)"

            echo "Could not list repository Actions secrets."
            echo "HTTP status: ${status}"
            if [ -n "$message" ]; then
              echo "GitHub message: ${message}"
            fi
            if [ -s "$error_file" ]; then
              cat "$error_file"
            fi

            {
              echo "- Could not list repository Actions secrets."
              echo "- HTTP status: ${status}"
              if [ -n "$message" ]; then
                echo "- GitHub message: ${message}"
              fi
              echo ""
              echo "If this fails with a permissions error, create a repository secret named ACTIONS_SECRET_READER_TOKEN with a token that can read Actions secret metadata, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
