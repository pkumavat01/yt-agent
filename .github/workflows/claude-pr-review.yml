name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.type == 'User' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Resolve per-author secret name
        id: secret_name
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          sanitized=$(echo "$PR_AUTHOR" | sed 's/[^[:alnum:]]/_/g' | tr '[:lower:]' '[:upper:]')
          case "$sanitized" in
            [0-9]*) sanitized="U_$sanitized" ;;
          esac
          echo "name=${sanitized}_CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_OUTPUT"
          echo "Resolved secret name for @${PR_AUTHOR}: ${sanitized}_CLAUDE_CODE_OAUTH_TOKEN"

      - name: Check whether author's token is registered
        id: token_check
        env:
          TOKEN: ${{ secrets[steps.secret_name.outputs.name] }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log Claude token source
        if: steps.token_check.outputs.has_token == 'true'
        env:
          SECRET_NAME: ${{ steps.secret_name.outputs.name }}
        run: |
          echo "Using Claude OAuth token from repository secret: ${SECRET_NAME}"

      - name: Post auth instructions when token is missing
        if: steps.token_check.outputs.has_token == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SECRET_NAME: ${{ steps.secret_name.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/auth-comment.md <<EOF
          ### Claude PR Review skipped — token not registered

          Hi @${PR_AUTHOR}, your personal Claude OAuth token is not registered in this repository, so the automated Claude review was skipped for this PR.

          To enable Claude reviews on your future PRs, register your token **once** as a repository secret by running:

          \`\`\`bash
          gh secret set ${SECRET_NAME} \\
            --repo ${REPO} \\
            --body "<your-claude-code-oauth-token>"
          \`\`\`

          After registering, push a new commit (or re-run this workflow) and the Claude review will run automatically on every PR you open.

          > Don't have a token yet? Generate one by running \`claude setup-token\` in the Claude Code CLI.
          EOF
          gh pr comment "${PR_NUMBER}" --body-file /tmp/auth-comment.md

      - name: Run Claude PR Review
        if: steps.token_check.outputs.has_token == 'true'
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695
        with:
          claude_code_oauth_token: ${{ secrets[steps.secret_name.outputs.name] }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Step 1 — fetch the diff with ONE command only:
              gh pr diff ${{ github.event.pull_request.number }}

            Step 2 — review ONLY the diff output from Step 1. Do NOT call Read, Grep, Glob, or any other tool to open files. Every issue you flag must be traceable to a specific + line in the diff. If you cannot see the violation in the diff, do not flag it.

            WHAT TO IGNORE:
            - Lines starting with space or - (unchanged/removed context) — not your concern
            - `node_modules/`, `dist/`, and build artifacts
            - `package-lock.json` churn unless a dependency change introduces a known vulnerability
            - Issues that were already present before this PR — if the + line is just moving or copying existing code, skip it
            - Stylistic preferences, minor nitpicks, or anything subjective

            WHAT TO FLAG:
            - Committed secrets, tokens, or credentials in code, `.env*`, or test fixtures
            - Use of `eval()` or other dynamic code execution
            - Any `any` type in TypeScript introduced by the + lines
            - Missing error handling for async calls where failures would break functionality
            - New dependencies added in `package.json` that look suspicious or unnecessary
            - Broken exports, missing or incorrect types in changes to `src/mastra/`

            Step 3 — post ALL inline comments in one batch using mcp__github_inline_comment__create_inline_comment (confirmed: true). Only on + lines. If nothing to flag, skip this step.

            Step 4 — post ONE summary using: gh pr comment ${{ github.event.pull_request.number }} --body "..."

            ---

            YT-AGENT PROJECT RULES (check only what is visible in the diff):

            TYPESCRIPT / NODE:
            - No `any` — prefer explicit types and interfaces.
            - `const`/`let` only (no `var`).
            - Await async calls where their failures affect behavior; add try/catch as needed.
            - Validate inputs for public functions/agents and guard nullable values before property access.

            PROJECT STRUCTURE:
            - Core code lives under `src/mastra/` with subfolders: `agents/`, `scorers/`, `tools/`, `workflows/`.
            - New reusable modules should be placed under these directories accordingly.
            - Tests should be added or updated alongside changes when relevant.

            SECURITY / SECRETS:
            - No API keys, OAuth tokens, or credentials committed in source or fixtures.
            - Prefer environment variables or secrets for credentials; do not expose them in logs or test output.

            LINT / QUALITY:
            - Flag additions that bypass lint rules or add `// eslint-disable` without justification.
            - If the PR changes `package.json` scripts or devDependencies, flag for review.

            ---

            SUMMARY FORMAT (post via gh pr comment):

            ### Claude yt-agent Code Review

            **Critical** (must fix before merge — security, leaked secrets, runtime crash risks)
            - <issue> — <file>:<line>

            **High** (should fix before merge — logic bugs, missing null checks, incorrect exports or types)
            - <issue> — <file>:<line>

            **Looks good**
            - <what passed>

            **Areas reviewed:** agents, scorers, tools, workflows, package.json, tests (pass/fail)

          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*)"
        env:
          INPUT_MAX_TURNS: '12'